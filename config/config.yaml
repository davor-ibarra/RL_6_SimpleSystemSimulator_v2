{
  "simulation": {
    "n_episodes": 5000,
    "episode_duration_sec": 10.0,
    "dt_sec": 0.001,
    "decision_interval_sec": 0.02
  },
  "termination": {
    "boundary": {
      "cart_position": [-5.0, 5.0],
      "pendulum_angle": [-1.0472, 1.0472]
    },
    "stabilization": {
      "pendulum_angle": [-0.02, 0.02],
      "pendulum_velocity": [-0.05, 0.05],
      "cart_position": [-0.1, 0.1],
      "cart_velocity": [-0.1, 0.1]
    },
    "reason_codes": {
      "none": 0,
      "limit_exceeded": 1,
      "stabilization_success": 2,
      "time_limit": 3
    }
  },
  "dynamic_system": {
    "name": "cart_pole",
    "initial_state": {
      "cart_position": 0.0,
      "cart_velocity": 0.0,
      "pendulum_angle": 0.157,
      "pendulum_velocity": 0.0
    },
    "params": {
      "mass_cart_kg": 5.0,
      "mass_pendulum_kg": 1.0,
      "l": 1.0,
      "g": 9.81,
      "cart_friction_coef": 0.0,
      "pivot_friction_coef": 0.0,
      "max_torque_nm": 2.0,
      "gear_ratio": 1.0,
      "pinion_radius_m": 0.05
    },
    "state_normalization": {
      "output_limits": [-1.0, 1.0],
      "ranges": {
        "cart_position": [-5.0, 5.0],
        "cart_velocity": [-7.5, 7.5],             # 8.0
        "pendulum_angle": [-1.0472, 1.0472],
        "pendulum_velocity": [-3.0, 3.0]          # 3.5
      }
    }
  },
  "control": {
    "mixing_policy": "sum",
    "global_actuator_limits": [-1.0, 1.0],
    "objectives_in": "norm",                      # "raw"  |  "norm"
    "controllers": [
      {
        "id": "pendulum_angle",
        "objective": "pendulum_angle",
        "setpoint_raw": 0.0,
        "error_sign": "measurement_minus_setpoint",
        "calculation_mode": "incremental",           # "position" | "incremental"
        "initial_gains": {"kp": 1.0, "ki": 1.0, "kd": 1.0},
        "gain_update": {
          "kp": {"min": 0.0, "max": 5, "delta_gain": 0.1},
          "ki": {"min": 0.0, "max": 5, "delta_gain": 0.1},
          "kd": {"min": 0.0, "max": 5, "delta_gain": 0.1}
        },
        "antiwindup": {"method": "conditional"}
      },
      {
        "id": "cart_position",
        "objective": "cart_position",
        "setpoint_raw": 0.0,
        "error_sign": "measurement_minus_setpoint",
        "calculation_mode": "incremental",            # "position" | "incremental"
        "initial_gains": {"kp": 1.0, "ki": 1.0, "kd": 1.0},
        "gain_update": {
          "kp": {"min": 0.0, "max": 5, "delta_gain": 0.1},
          "ki": {"min": 0.0, "max": 5, "delta_gain": 0.1},
          "kd": {"min": 0.0, "max": 5, "delta_gain": 0.1}
        },
        "antiwindup": {"method": "conditional"}
      }
    ],
    "signal_normalization": [
      {
        "var_obj": "pendulum_angle",
        "signals": {
          "error": [-1.0472, 1.0472],
          "derivative_error": [-3.0, 3.0],
          "integral_error": [-0.5, 0.5],
          "u_demand": [-3.0, 3.0],
          "delta_u_demand": [-0.015, 0.015],
          "u_alloc": [-4.0, 4.0],
          "delta_u_alloc": [-0.15, 0.15],
          "u_unallocated": [-3.0, 3.0]
        }
      },
      {
        "var_obj": "cart_position",
        "signals": {
          "error": [-3.0, 3.0],
          "derivative_error": [-7.0, 7.0],
          "integral_error": [-5.0, 5.0],
          "u_demand": [-3.0, 3.0],
          "delta_u_demand": [-0.005, 0.005],
          "u_alloc": [-3.0, 3.0],
          "delta_u_alloc": [-0.005, 0.005],
          "u_unallocated": [-2.0, 2.0]
        }
      }
    ]
  },
  "agent": {
    "type": "pid_qlearning",
    "params": {
      "algorithm": "q_learning",
      "discount_factor": 0.997,
      "epsilon": 1.0,
      "epsilon_decay": {
        "enabled": true,
        "decay_factor": 0.998849,                   # 0.998849 (5000) | 0.999488 (10000)
        "epsilon_min": 0.01
      },
      "learning_rate": 0.2,
      "learning_rate_decay": {
        "enabled": true,
        "decay_factor": 0.99925,                    # 0.99925 (5000) | 0.999667 (10000)
        "learning_rate_min": 0.01
      }
    },
    "actions": [
      {"id": 0, "label": "decrease", "move": -1},
      {"id": 1, "label": "maintain", "move": 0},
      {"id": 2, "label": "increase", "move": 1}
    ],
    "gain_agents": [
      {"id": "kp_pendulum_angle", "controller": "pendulum_angle", "gain": "kp", "additional_state": false},
      {"id": "ki_pendulum_angle", "controller": "pendulum_angle", "gain": "ki", "additional_state": false},
      {"id": "kd_pendulum_angle", "controller": "pendulum_angle", "gain": "kd", "additional_state": false},
      {"id": "kp_cart_position", "controller": "cart_position", "gain": "kp", "additional_state": false},
      {"id": "ki_cart_position", "controller": "cart_position", "gain": "ki", "additional_state": false},
      {"id": "kd_cart_position", "controller": "cart_position", "gain": "kd", "additional_state": false}
    ],
    "additional_state": [
      {
        "id": "regime_cooperative",
        "source": "cooperative_potential_01",
        "min": 0.0,
        "max": 1.0,
        "thresholds": [0.7]
      }
    ]
  },
  "metrics": {
    "aggregation_output_limits": [0.0, 1.0],
    "interval_metrics": [
      {
        "source": "error_pendulum_angle_norm",
        "step_transform": "square",
        "aggregation": "sum",
        "raw_target": "raw_cost_error_pendulum_angle_square_sum",
        "bound": 20.0,
        "target": "cost_01_error_pendulum_angle_square_sum",
        "diagnostics": [
          {"method": "rms", "raw_target": "raw_cost_error_pendulum_angle_rms", "bound": 1.0, "target": "cost_01_error_pendulum_angle_rms"}
        ]
      },
      {
        "source": "rate_error_pendulum_angle_norm",
        "step_transform": "none",
        "aggregation": "none",
        "raw_target": "raw_cost_rate_error_pendulum_angle",
        "bound": [-2.0, 4.5],
        "target": "cost_01_rate_error_pendulum_angle"
      },
      {
        "source": "ratio_error_pendulum_angle_norm",
        "step_transform": "none",
        "aggregation": "none",
        "raw_target": "raw_cost_ratio_error_pendulum_angle",
        "bound": [0.985, 1.06],
        "target": "cost_01_ratio_error_pendulum_angle"
      },
      {
        "source": "growth_error_pendulum_angle_norm",
        "step_transform": "none",
        "aggregation": "none",
        "raw_target": "raw_cost_growth_error_pendulum_angle",
        "bound": 0.06,
        "target": "cost_01_growth_error_pendulum_angle"
      },
      {
        "source": "error_pendulum_angle_norm",
        "step_transform": "abs",
        "aggregation": "mean",
        "raw_target": "raw_cost_residue_pendulum_angle",
        "bound": 10.0,
        "target": "cost_01_residue_pendulum_angle"
      },
      {
        "source": "integral_error_pendulum_angle_raw",
        "step_transform": "abs",
        "aggregation": "mean",
        "raw_target": "raw_cost_memory_pendulum_angle",
        "bound": 1.0,
        "target": "cost_01_memory_pendulum_angle"
      },
      {
        "source": "derivative_error_pendulum_angle_raw",
        "step_transform": "square",
        "aggregation": "mean",
        "raw_target": "raw_cost_derivative_error_pendulum_angle_square_mean",
        "bound": 5,
        "target": "cost_01_derivative_error_pendulum_angle_square_mean",
        "diagnostics": [
          {"method": "rms", "raw_target": "raw_cost_derivative_error_pendulum_angle_rms", "bound": 2.0, "target": "cost_01_derivative_error_pendulum_angle_rms"}
        ]
      },
      {
        "source": "u_unallocated_pendulum_angle_raw",
        "denominator_source": "u_demand_pendulum_angle_raw",
        "step_transform": "identity",
        "aggregation": "mean_abs_ratio",
        "epsilon": 1.0e-12,
        "raw_target": "raw_cost_allocation_pendulum_angle",
        "bound": 1.0,
        "target": "cost_01_allocation_pendulum_angle"
      },
      {
        "source": "error_cart_position_norm",
        "step_transform": "square",
        "aggregation": "sum",
        "raw_target": "raw_cost_error_cart_position_square_sum",
        "bound": 2.0,
        "target": "cost_01_error_cart_position_square_sum",
        "diagnostics": [
          {"method": "rms", "raw_target": "raw_cost_error_cart_position_rms", "bound": 0.7, "target": "cost_01_error_cart_position_rms"}
        ]
      },
      {
        "source": "rate_error_cart_position_norm",
        "step_transform": "none",
        "aggregation": "none",
        "raw_target": "raw_cost_rate_error_cart_position",
        "bound": 0.5,
        "target": "cost_01_rate_error_cart_position"
      },
      {
        "source": "ratio_error_cart_position_norm",
        "step_transform": "none",
        "aggregation": "none",
        "raw_target": "raw_cost_ratio_error_cart_position",
        "bound": [0.995, 1.17],
        "target": "cost_01_ratio_error_cart_position"
      },
      {
        "source": "growth_error_cart_position_norm",
        "step_transform": "none",
        "aggregation": "none",
        "raw_target": "raw_cost_growth_error_cart_position",
        "bound": 0.05,
        "target": "cost_01_growth_error_cart_position"
      },
      {
        "source": "error_cart_position_norm",
        "step_transform": "abs",
        "aggregation": "mean",
        "raw_target": "raw_cost_residue_cart_position",
        "bound": 9.45,
        "target": "cost_01_residue_cart_position"
      },
      {
        "source": "integral_error_cart_position_raw",
        "step_transform": "abs",
        "aggregation": "mean",
        "raw_target": "raw_cost_memory_cart_position",
        "bound": 30.0,
        "target": "cost_01_memory_cart_position"
      },
      {
        "source": "derivative_error_cart_position_raw",
        "step_transform": "square",
        "aggregation": "mean",
        "raw_target": "raw_cost_derivative_error_cart_position_square_mean",
        "bound": 0.3,
        "target": "cost_01_derivative_error_cart_position_square_mean",
        "diagnostics": [
          {"method": "rms", "raw_target": "raw_cost_derivative_error_cart_position_rms", "bound": 2.5, "target": "cost_01_derivative_error_cart_position_rms"}
        ]
      },
      {
        "source": "u_unallocated_cart_position_raw",
        "denominator_source": "u_demand_cart_position_raw",
        "step_transform": "identity",
        "aggregation": "mean_abs_ratio",
        "epsilon": 1.0e-12,
        "raw_target": "raw_cost_allocation_cart_position",
        "bound": 1.0,
        "target": "cost_01_allocation_cart_position"
      },
      {
        "source": "u_total",
        "step_transform": "square",
        "aggregation": "mean",
        "raw_target": "raw_cost_u_total_square_mean",
        "bound": 1.0,
        "target": "cost_01_u_total_square_mean",
        "diagnostics": [
          {"method": "rms", "raw_target": "raw_cost_u_total_rms", "bound": 1.0, "target": "cost_01_u_total_rms"}
        ]
      },
      {
        "source": "delta_u_total",
        "step_transform": "square",
        "aggregation": "sum",
        "raw_target": "raw_cost_delta_u_total_square_sum",
        "bound": 0.02,
        "target": "cost_01_delta_u_total_square_sum",
        "diagnostics": [
          {"method": "rms", "raw_target": "raw_cost_delta_u_total_rms", "bound": 0.03, "target": "cost_01_delta_u_total_rms"}
        ]
      }
    ]
  },
  "reward": {
    "assignment": "controller_reward",
    "domain": "signed_unit",
    "composition": {
      "weights": {
        "local": 1.0,
        "cooperative": 0.0,
        "strategic": 0.0
      }
    },
    "local": {
      "controllers": [
        {
          "controller": "pendulum_angle",
          "components": [
            {"cost": "cost_01_error_pendulum_angle_rms", "weight": 1.0},
            {"cost": "cost_01_derivative_error_pendulum_angle_rms", "weight": 0.0},
            {"cost": "cost_01_memory_pendulum_angle", "weight": 0.0},
            {"cost": "cost_01_delta_u_total_rms", "weight": 0.0}
          ]
        },
        {
          "controller": "cart_position",
          "components": [
            {"cost": "cost_01_error_cart_position_rms", "weight": 1.0},
            {"cost": "cost_01_derivative_error_cart_position_rms", "weight": 0.0},
            {"cost": "cost_01_memory_cart_position", "weight": 0.0},
            {"cost": "cost_01_delta_u_total_rms", "weight": 0.0}
          ]
        }
      ]

    },
    "cooperative": {
      "enabled": true,
      "mode": "geometric_consensus",                       # "norm-p" | "geometric_consensus"
      "reward_mode": "progress_residual",              # "absolute" | "progress" | "progress_residual" | "regime_residual"
      "p": 10.0,                             # p=1 simple weighted | p=2 RMS weighted | p>2 more aggressive
      "epsilon_geom_conc": 1.0e-8,
      "residual_weight": 0.1,
      "variable_weights": {
        "pendulum_angle": 0.6,
        "cart_position": 0.4
      },
      "adaptive_weights": {
        "enabled": true,
        "weight_floor": 0.2,
        "deterioration_weight": 0.2,
        "smoothing_alpha": 0.0
      },
      "synchrony": {
        "enabled": true,
        "strength": 0.2
      },
      "adaptive_residual": {
        "enabled": true,
        "residual_weight_min": 0.02,
        "residual_weight_max": 0.1,
        "gamma": 2.0
      },
      "regime_residual_params": {
        "signal": "regime_cooperative",
        "thresholds": [0.7],
        "reward_mode_by_regime": {"0": "progress_residual", "1": "progress_residual"},   # "0": "absolute", "1": "progress_residual", "2": "progress_residual"
        "residual_weight_by_regime": {"0": 0.03, "1": 0.08}
      }
    },  
    "strategic": {
      "enabled": false
    },
    terminal_learning_bonus: {
      "enabled": true,
      "bonuses":{
        "limit_exceeded": -50.0,            # 5 -> suave | 10 -> clara | 5 -> fuerte | 50 -> dominante pero defendible
        "stabilization_success": 20.0,
        "time_limit": 0.0,
        "none": 0.0
        },
      },
  },
  "data": {
    "output_root": "results_history_CartPole",
    "episodes_per_dataset_chunk": 250,
    "save_agent_state": true,
    "agent_state_save_frequency": 2000,

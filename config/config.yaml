{
  "simulation": {
    "mode": "training",                       # "training" | "fixed_pid"
    "n_episodes": 5000,
    "episode_duration_sec": 10.0,
    "dt_sec": 0.001,
    "decision_interval_sec": 0.02
  },
  "termination": {
    "boundary": {
      "cart_position": [-5.0, 5.0],
      "pendulum_angle": [-1.0472, 1.0472]
    },
    "stabilization": {
      "mode": "persistence",                       # "instantaneous" | "persistence"
      "persistence_sec": 0.1,
      "pendulum_angle": [-0.02, 0.02],
      "pendulum_velocity": [-0.05, 0.05],
      "cart_position": [-0.1, 0.1],
      "cart_velocity": [-0.1, 0.1]
    },
    "reason_codes": {
      "none": 0,
      "limit_exceeded": 1,
      "stabilization_success": 2,
      "time_limit": 3
    }
  },
  "dynamic_system": {
    "name": "cart_pole",
    "initial_state": {
      "cart_position": 0.0,
      "cart_velocity": 0.0,
      "pendulum_angle": 0.157,
      "pendulum_velocity": 0.0
    },
    "params": {
      "mass_cart_kg": 5.0,
      "mass_pendulum_kg": 1.0,
      "l": 1.0,
      "g": 9.81,
      "cart_friction_coef": 0.0,
      "pivot_friction_coef": 0.0,
      "max_torque_nm": 2.0,
      "gear_ratio": 1.0,
      "pinion_radius_m": 0.05
    },
    "state_normalization": {
      "output_limits": [-1.0, 1.0],
      "ranges": {
        "cart_position": [-5.0, 5.0],
        "cart_velocity": [-7.5, 7.5],             # 8.0
        "pendulum_angle": [-1.0472, 1.0472],
        "pendulum_velocity": [-3.0, 3.0]          # 3.5
      }
    }
  },
  "control": {
    "mixing_policy": "sum",
    "global_actuator_limits": [-1.0, 1.0],
    "objectives_in": "norm",                      # "raw"  |  "norm"
    "controllers": [
      {
        "id": "pendulum_angle",
        "objective": "pendulum_angle",
        "setpoint_raw": 0.0,
        "setpoint_norm": 0.0,
        "error_sign": "measurement_minus_setpoint",
        "calculation_mode": "incremental",           # "position" | "incremental"
        "initial_gains": {"kp": 1.0, "ki": 1.0, "kd": 1.0},
        "gain_update": {
          "kp": {"min": 0.0, "max": 5, "delta_gain": 0.25},
          "ki": {"min": 0.0, "max": 5, "delta_gain": 0.25},
          "kd": {"min": 0.0, "max": 5, "delta_gain": 0.25}
        },
        "antiwindup": {"method": "conditional"}
      },
      {
        "id": "cart_position",
        "objective": "cart_position",
        "setpoint_raw": 0.0,
        "setpoint_norm": 0.0,
        "error_sign": "measurement_minus_setpoint",
        "calculation_mode": "incremental",            # "position" | "incremental"
        "initial_gains": {"kp": 1.0, "ki": 1.0, "kd": 1.0},
        "gain_update": {
          "kp": {"min": 0.0, "max": 5, "delta_gain": 0.25},
          "ki": {"min": 0.0, "max": 5, "delta_gain": 0.25},
          "kd": {"min": 0.0, "max": 5, "delta_gain": 0.25}
        },
        "antiwindup": {"method": "conditional"}
      }
    ]
  },
  "agent": {
    "type": "pid_qlearning",
    "params": {
      "algorithm": "q_learning",
      "discount_factor": 0.997,
      "epsilon": 1.0,
      "epsilon_decay": {
        "enabled": true,
        "decay_factor": 0.998849,                   # 0.998849 (5000) | 0.999488 (10000)
        "epsilon_min": 0.01
      },
      "learning_rate": 0.2,
      "learning_rate_decay": {
        "enabled": true,
        "decay_factor": 0.99925,                    # 0.99925 (5000) | 0.999667 (10000)
        "learning_rate_min": 0.01
      }
    },
    "actions": [
      {"id": 0, "label": "decrease", "move": -1},
      {"id": 1, "label": "maintain", "move": 0},
      {"id": 2, "label": "increase", "move": 1}
    ],
    "gain_agents": [
      {"id": "kp_pendulum_angle", "controller": "pendulum_angle", "gain": "kp", "additional_state": false},
      {"id": "ki_pendulum_angle", "controller": "pendulum_angle", "gain": "ki", "additional_state": false},
      {"id": "kd_pendulum_angle", "controller": "pendulum_angle", "gain": "kd", "additional_state": false},
      {"id": "kp_cart_position", "controller": "cart_position", "gain": "kp", "additional_state": false},
      {"id": "ki_cart_position", "controller": "cart_position", "gain": "ki", "additional_state": false},
      {"id": "kd_cart_position", "controller": "cart_position", "gain": "kd", "additional_state": false}
    ],
    "additional_state": [
      {
        "id": "regime_cooperative",
        "source": "cooperative_potential_01",
        "min": 0.0,
        "max": 1.0,
        "thresholds": [0.7]
      }
    ]
  },
  "metrics": {
    "output_limits": [0.0, 1.0],
    "interval_metrics": [
      {
        "source": "error_pendulum_angle_norm",
        "sample_transform": {"method": "abs"},
        "interval_reduce": {"method": "mean"},
        "post_transform": {"method": "none"},
        "raw_target": "metric_error_pendulum_angle_mean_abs_norm",
        "scaler": {"method": "bound", "mode": "positive", "bound": 1.0, "clip": true},
        "target": "cost_01_error_pendulum_angle_operating"
      },
      {
        "source": "error_cart_position_norm",
        "sample_transform": {"method": "abs"},
        "interval_reduce": {"method": "mean"},
        "post_transform": {"method": "none"},
        "raw_target": "metric_error_cart_position_mean_abs_norm",
        "scaler": {"method": "bound", "mode": "positive", "bound": 0.9, "clip": true},
        "target": "cost_01_error_cart_position_operating"
      },
      {
        "source": "error_pendulum_angle_norm",
        "sample_transform": {"method": "identity"},
        "interval_reduce": {"method": "rms"},
        "post_transform": {"method": "none"},
        "raw_target": "raw_cost_error_pendulum_angle_rms",
        "scaler": {"method": "bound", "mode": "positive", "bound": 1.0, "clip": true},
        "target": "cost_01_error_pendulum_angle_rms"
      },
      {
        "source": "error_cart_position_norm",
        "sample_transform": {"method": "identity"},
        "interval_reduce": {"method": "rms"},
        "post_transform": {"method": "none"},
        "raw_target": "raw_cost_error_cart_position_rms",
        "scaler": {"method": "bound", "mode": "positive", "bound": 0.9, "clip": true},
        "target": "cost_01_error_cart_position_rms"
      },
      {
        "source": "error_pendulum_angle_norm",
        "sample_transform": {"method": "identity"},
        "interval_reduce": {"method": "last_minus_first", "audit_target": "delta_error_pendulum_angle"},
        "post_transform": {"method": "abs", "audit_target": "abs_delta_error_pendulum_angle"},
        "raw_target": "raw_cost_delta_error_pendulum_angle",
        "scaler": {"method": "bound", "mode": "positive", "bound": 0.05, "clip": true},
        "target": "cost_01_delta_error_pendulum_angle"
      },
      {
        "source": "error_cart_position_norm",
        "sample_transform": {"method": "identity"},
        "interval_reduce": {"method": "last_minus_first", "audit_target": "delta_error_cart_position"},
        "post_transform": {"method": "abs", "audit_target": "abs_delta_error_cart_position"},
        "raw_target": "raw_cost_delta_error_cart_position",
        "scaler": {"method": "bound", "mode": "positive", "bound": 0.03, "clip": true},
        "target": "cost_01_delta_error_cart_position"
      },
      {
        "source": "error_pendulum_angle_norm",
        "sample_transform": {"method": "square"},
        "interval_reduce": {"method": "sum"},
        "post_transform": {"method": "none"},
        "raw_target": "raw_cost_error_pendulum_angle_sum_square",
        "scaler": {"method": "bound", "mode": "positive", "bound": 20.0, "clip": true},
        "target": "cost_error_pendulum_angle_sum_square"
      },
      {
        "source": "error_cart_position_norm",
        "sample_transform": {"method": "square"},
        "interval_reduce": {"method": "sum"},
        "post_transform": {"method": "none"},
        "raw_target": "raw_cost_error_cart_position_sum_square",
        "scaler": {"method": "bound", "mode": "positive", "bound": 20.0, "clip": true},
        "target": "cost_error_cart_position_sum_square"
      },
      {
        "source": "error_pendulum_angle_norm",
        "sample_transform": {"method": "asinh", "scale": 1.0},
        "interval_reduce": {"method": "rms"},
        "post_transform": {"method": "none"},
        "raw_target": "raw_cost_error_pendulum_angle_asinh_rms",
        "scaler": {"method": "bound", "mode": "positive", "bound": 0.9, "clip": true},
        "target": "cost_error_pendulum_angle_asinh_rms"
      },
      {
        "source": "error_cart_position_norm",
        "sample_transform": {"method": "asinh", "scale": 1.0},
        "interval_reduce": {"method": "rms"},
        "post_transform": {"method": "none"},
        "raw_target": "raw_cost_error_cart_position_asinh_rms",
        "scaler": {"method": "bound", "mode": "positive", "bound": 0.9, "clip": true},
        "target": "cost_error_cart_position_asinh_rms"
      },
      {
        "source": "integral_error_pendulum_angle_norm",
        "sample_transform": {"method": "identity"},
        "interval_reduce": {"method": "rms"},
        "post_transform": {"method": "none"},
        "raw_target": "raw_cost_memory_pendulum_angle",
        "scaler": {"method": "bound", "mode": "positive", "bound": 0.281735186795783, "clip": true},  # P95 max(|min|, |max|), run_20260717_2237
        "target": "cost_01_memory_pendulum_angle"
      },
      {
        "source": "integral_error_cart_position_norm",
        "sample_transform": {"method": "identity"},
        "interval_reduce": {"method": "rms"},
        "post_transform": {"method": "none"},
        "raw_target": "raw_cost_memory_cart_position",
        "scaler": {"method": "bound", "mode": "positive", "bound": 1.02340668487968, "clip": true},  # P95 max(|min|, |max|), run_20260717_2237
        "target": "cost_01_memory_cart_position"
      },
      {
        "source": "derivative_error_pendulum_angle_norm",
        "sample_transform": {"method": "identity"},
        "interval_reduce": {"method": "rms"},
        "post_transform": {"method": "none"},
        "raw_target": "raw_cost_derivative_error_pendulum_angle_rms",
        "scaler": {"method": "bound", "mode": "positive", "bound": 2.15414686481494, "clip": true},  # P95 max(|min|, |max|), run_20260717_2237
        "target": "cost_01_derivative_error_pendulum_angle_rms"
      },
      {
        "source": "derivative_error_cart_position_norm",
        "sample_transform": {"method": "identity"},
        "interval_reduce": {"method": "rms"},
        "post_transform": {"method": "none"},
        "raw_target": "raw_cost_derivative_error_cart_position_rms",
        "scaler": {"method": "bound", "mode": "positive", "bound": 1.07030634970877, "clip": true},  # P95 max(|min|, |max|), run_20260717_2237
        "target": "cost_01_derivative_error_cart_position_rms"
      },
      {
        "source": "u_total",
        "sample_transform": {"method": "identity"},
        "interval_reduce": {"method": "rms"},
        "post_transform": {"method": "none"},
        "raw_target": "raw_cost_u_total_rms",
        "scaler": {"method": "bound", "mode": "positive", "bound": 1.0, "clip": true},
        "target": "cost_01_u_total_rms"
      },
      {
        "source": "u_total",
        "sample_transform": {"method": "identity"},
        "interval_reduce": {"method": "last_minus_first", "audit_target": "delta_u_total_interval"},
        "post_transform": {"method": "abs"},
        "raw_target": "raw_cost_delta_u_total_abs",
        "scaler": {"method": "bound", "mode": "positive", "bound": 0.12, "clip": true},
        "target": "cost_01_delta_u_total_abs"
      },
      {
        "source": "error_pendulum_angle_norm",
        "sample_transform": {"method": "abs"},
        "interval_reduce": {
          "method": "median",
          "audit_stats": {
            "p25": "p25_abs_error_pendulum_angle",
            "p75": "p75_abs_error_pendulum_angle",
            "iqr": "iqr_abs_error_pendulum_angle"
          }
        },
        "post_transform": {"method": "none"},
        "raw_target": "raw_cost_error_pendulum_angle_abs_median",
        "scaler": {"method": "bound", "mode": "positive", "bound": 1.0, "clip": true},
        "target": "cost_01_error_pendulum_angle_abs_median_robust"
      },
      {
        "source": "error_cart_position_norm",
        "sample_transform": {"method": "abs"},
        "interval_reduce": {
          "method": "median",
          "audit_stats": {
            "p25": "p25_abs_error_cart_position",
            "p75": "p75_abs_error_cart_position",
            "iqr": "iqr_abs_error_cart_position"
          }
        },
        "post_transform": {"method": "none"},
        "raw_target": "raw_cost_error_cart_position_abs_median",
        "scaler": {"method": "bound", "mode": "positive", "bound": 0.9, "clip": true},
        "target": "cost_01_error_cart_position_abs_median_robust"
      },
      {
        "sources": [
          "cost_01_error_pendulum_angle_rms",
          "cost_01_error_cart_position_rms"
        ],
        "sample_transform": {"method": "identity"},
        "interval_reduce": {
          "method": "oriented_rate_alignment",
          "objective": "minimize",
          "epsilon": 1.0e-12
        },
        "post_transform": {"method": "none"},
        "raw_target": "raw_evolution_alignment",
        "scaler": {"method": "minmax", "range": [0.0, 1.0], "clip": true},
        "target": "evolution_alignment_01"
      }
    ]
  },
  "reward": {
    "assignment": "controller_reward",        # controller_reward | global_reward
    "domain": "signed_unit",
    "composition": {
      "weights": {
        "local": 0.5,
        "cooperative": 0.5,
        "strategic": 0.0
      }
    },
    "local": {
      "controllers": [
        {
          "controller": "pendulum_angle",
          "components": [
            {"cost": "cost_01_error_pendulum_angle_operating", "weight": 1.0},
            # {"cost": "cost_01_error_pendulum_angle_rms", "weight": 0.0},
            # {"cost": "cost_error_pendulum_angle_sum_square", "weight": 0.0},
            # {"cost": "cost_error_pendulum_angle_asinh_rms", "weight": 0.0},
            # {"cost": "cost_01_delta_error_pendulum_angle", "weight": 0.0},
            {"cost": "cost_01_derivative_error_pendulum_angle_rms", "weight": 0.0},
            {"cost": "cost_01_memory_pendulum_angle", "weight": 0.0},
            # {"cost": "cost_01_u_total_rms", "weight": 0.0},
            # {"cost": "cost_01_delta_u_total_abs", "weight": 0.0}
          ]
        },
        {
          "controller": "cart_position",
          "components": [
            {"cost": "cost_01_error_cart_position_operating", "weight": 1.0},
            # {"cost": "cost_01_error_cart_position_rms", "weight": 0.0},
            # {"cost": "cost_error_cart_position_sum_square", "weight": 0.0},
            # {"cost": "cost_error_cart_position_asinh_rms", "weight": 0.0},
            # {"cost": "cost_01_delta_error_cart_position", "weight": 0.0},
            {"cost": "cost_01_derivative_error_cart_position_rms", "weight": 0.0},
            {"cost": "cost_01_memory_cart_position", "weight": 0.0},
            # {"cost": "cost_01_u_total_rms", "weight": 0.0},
            # {"cost": "cost_01_delta_u_total_abs", "weight": 0.0}
          ]
        }
      ]

    },
    "cooperative": {
      "enabled": true,
      "reward_mode": "absolute",              # "absolute" | "progress" | "progress_residual" | "regime_residual"
      "residual_weight": 0.1,
      "potential": {
        "method": "norm-p",                   # "norm-p" | "geometric_consensus" | "concurrent_progress"
        "p": 32.0,                              # p=1 simple weighted | p=2 RMS weighted | p>2 more aggressive
        "epsilon_geom_conc": 1.0e-8,
        "deterioration_order": 2.0,
        "variables": [
          {"id": "pendulum_angle", "source": "local_cost_01_pendulum_angle", "weight": 0.5},
          {"id": "cart_position", "source": "local_cost_01_cart_position", "weight": 0.5}
        ]
      },
      "adaptive_weights": {
        "enabled": false,
        "weight_floor": 0.25,
        "deterioration_weight": 0.0,
        "smoothing_alpha": 0.0,
        "need_variables": [
          {"id": "pendulum_angle", "source": "local_cost_01_pendulum_angle"},
          {"id": "cart_position", "source": "local_cost_01_cart_position"}
        ]
      },
      "balance": {
        "enabled": false,
        "strength": 0.2,
        "health_variables": [
          {"id": "pendulum_angle", "source": "local_health_01_pendulum_angle"},
          {"id": "cart_position", "source": "local_health_01_cart_position"}
        ]
      },
      "synchrony": {
        "enabled": false,
        "source": "evolution_alignment_01",
        "strength": 0.2
      },
      "adaptive_residual": {                            # valores altos aumentan el peso residual segun `gamma`
        "enabled": false,
        "source": "cooperative_potential_01",
        "residual_weight_min": 0.02,
        "residual_weight_max": 0.1,
        "gamma": 2.0
      },
      "regime_residual_params": {
        "signal": "regime_cooperative",
        "thresholds": [0.7],
        "reward_mode_by_regime": {"0": "progress_residual", "1": "progress_residual"},   # "0": "absolute", "1": "progress_residual", "2": "progress_residual"
        "residual_weight_by_regime": {"0": 0.03, "1": 0.08}
      }
    },  
    "strategic": {
      "enabled": false
    },
    terminal_learning_bonus: {
      "enabled": true,
      "bonuses":{
        "limit_exceeded": -50.0,            # 5 -> suave | 10 -> clara | 20 -> fuerte | 50 -> dominante pero defendible
        "stabilization_success": 20.0,
        "time_limit": 0.0,
        "none": 0.0
        },
      },
  },
  "data": {
    "output_root": "results_history_CartPole",
    "episodes_per_dataset_chunk": 250,
    "save_agent_state": true,
    "agent_state_save_frequency": 2000,
    "preserve_json_structure": true,
    "output_schema": {
      "step_data": [
        "t_sec",
        "cart_position_raw",
        "cart_velocity_raw",
        "pendulum_angle_raw",
        "pendulum_velocity_raw",
        "cart_position_norm",
        "cart_velocity_norm",
        "pendulum_angle_norm",
        "pendulum_velocity_norm",
        "cart_force",
        "u_total_raw",
        "u_total",
        "delta_u_total",
        "is_saturated_global",
        "saturation_excess",
        "saturation_proportion_global",
        "error_pendulum_angle_raw",
        "error_pendulum_angle_norm",
        "derivative_error_pendulum_angle_raw",
        "derivative_error_pendulum_angle_norm",
        "integral_error_pendulum_angle_raw",
        "integral_error_pendulum_angle_norm",
        "p_term_pendulum_angle_raw",
        "p_term_pendulum_angle_norm",
        "i_term_pendulum_angle_raw",
        "i_term_pendulum_angle_norm",
        "d_term_pendulum_angle_raw",
        "d_term_pendulum_angle_norm",
        "u_demand_pendulum_angle_raw",
        "u_demand_pendulum_angle_norm",
        "delta_u_demand_pendulum_angle_raw",
        "delta_u_demand_pendulum_angle_norm",
        "p_delta_term_pendulum_angle_raw",
        "p_delta_term_pendulum_angle_norm",
        "i_delta_term_pendulum_angle_raw",
        "i_delta_term_pendulum_angle_norm",
        "d_delta_term_pendulum_angle_raw",
        "d_delta_term_pendulum_angle_norm",
        "delta_u_incremental_pendulum_angle_raw",
        "delta_u_incremental_pendulum_angle_norm",
        "kp_pendulum_angle",
        "ki_pendulum_angle",
        "kd_pendulum_angle",
        "error_cart_position_raw",
        "error_cart_position_norm",
        "derivative_error_cart_position_raw",
        "derivative_error_cart_position_norm",
        "integral_error_cart_position_raw",
        "integral_error_cart_position_norm",
        "p_term_cart_position_raw",
        "p_term_cart_position_norm",
        "i_term_cart_position_raw",
        "i_term_cart_position_norm",
        "d_term_cart_position_raw",
        "d_term_cart_position_norm",
        "u_demand_cart_position_raw",
        "u_demand_cart_position_norm",
        "delta_u_demand_cart_position_raw",
        "delta_u_demand_cart_position_norm",
        "p_delta_term_cart_position_raw",
        "p_delta_term_cart_position_norm",
        "i_delta_term_cart_position_raw",
        "i_delta_term_cart_position_norm",
        "d_delta_term_cart_position_raw",
        "d_delta_term_cart_position_norm",
        "delta_u_incremental_cart_position_raw",
        "delta_u_incremental_cart_position_norm",
        "kp_cart_position",
        "ki_cart_position",
        "kd_cart_position"
      ],
      "interval_data": [
        "interval_id",
        "interval_start_step_idx",
        "interval_end_step_idx",
        "interval_t_start_sec",
        "interval_n_steps",
        "terminated",
        "termination_reason_code",
        "metric_error_pendulum_angle_mean_abs_norm",
        "cost_01_error_pendulum_angle_operating",
        "metric_error_cart_position_mean_abs_norm",
        "cost_01_error_cart_position_operating",
        "raw_cost_error_pendulum_angle_rms",
        "cost_01_error_pendulum_angle_rms",
        "raw_cost_error_cart_position_rms",
        "cost_01_error_cart_position_rms",
        "raw_evolution_alignment",
        "evolution_alignment_01",
        "delta_error_pendulum_angle",
        "abs_delta_error_pendulum_angle",
        "raw_cost_delta_error_pendulum_angle",
        "cost_01_delta_error_pendulum_angle",
        "delta_error_cart_position",
        "abs_delta_error_cart_position",
        "raw_cost_delta_error_cart_position",
        "cost_01_delta_error_cart_position",
        "raw_cost_error_pendulum_angle_sum_square",
        "cost_error_pendulum_angle_sum_square",
        "raw_cost_error_cart_position_sum_square",
        "cost_error_cart_position_sum_square",
        "raw_cost_error_pendulum_angle_asinh_rms",
        "cost_error_pendulum_angle_asinh_rms",
        "raw_cost_error_cart_position_asinh_rms",
        "cost_error_cart_position_asinh_rms",
        "raw_cost_memory_pendulum_angle",
        "cost_01_memory_pendulum_angle",
        "raw_cost_memory_cart_position",
        "cost_01_memory_cart_position",

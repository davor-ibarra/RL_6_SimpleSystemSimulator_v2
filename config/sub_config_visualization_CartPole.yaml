visualization:
  enabled: true
  plots:
    - type: bar
      enabled: true
      source: summary
      variable: end_termination_reason
      output_filename: fig1_termination_reason_distribution.png
      config:
        title: Termination Reason Distribution
        title_fontsize: 28
        figsize_w: 14
        figsize_h: 10
        xlabel: Episode Group [-]
        xlabel_fontsize: 24
        ylabel: Count [-]
        ylabel_fontsize: 24
        xmin: null
        xmax: null
        ymin: 0
        ymax: null
        tick_fontsize: 18
        xtick_rotation: 0
        num_xticks: null
        num_yticks: null
        show_legend: true
        legend_var:
          - {value: stabilization_success, color: "#0077BB", label: Goal reached}
          - {value: limit_exceeded, color: "#EE7733", label: Limit exceeded}
          - {value: time_limit, color: "#BBBBBB", label: Time limit}
          - {value: none, color: "#999999", label: None}
        legend_pos: lower right
        legend_fontsize: xx-large
        grid_on: false
        group_size: 1000
        cmap: tab20
        bar_width: 0.8

    - type: line
      enabled: true
      source: summary
      x_variable: episode_id
      y_variable: total_reward
      output_filename: fig2_cumulative_reward_per_episode.png
      config:
        title: Cumulative Reward per Episode
        title_fontsize: 14
        figsize_w: 12
        figsize_h: 6
        xlabel: Episode [-]
        xlabel_fontsize: 12
        ylabel: Total Reward [-]
        ylabel_fontsize: 12
        xmin: null
        xmax: null
        ymin: null
        ymax: null
        tick_fontsize: 10
        xtick_rotation: 30
        num_xticks: null
        num_yticks: null
        show_legend: false
        legend_pos: best
        grid_on: false
        line_color: "#1f77b4"
        line_width: 1.0
        marker_style: o
        marker_size: 3
        marker_color: "#ff7f0e"
        filter_termination_reason: null

    - type: multi_line
      enabled: true
      source: summary
      x_variable: episode_id
      y_variables:
        - {variable: total_reward_pendulum_angle, label: Pendulum angle, color: "#0077BB"}
        - {variable: total_reward_cart_position, label: Cart position, color: "#EE7733"}
      output_filename: fig2a_controller_reward_per_episode.png
      config:
        title: Controller Rewards per Episode
        title_fontsize: 14
        figsize_w: 12
        figsize_h: 6
        xlabel: Episode [-]
        xlabel_fontsize: 12
        ylabel: Controller Reward [-]
        ylabel_fontsize: 12
        xmin: null
        xmax: null
        ymin: null
        ymax: null
        tick_fontsize: 10
        xtick_rotation: 30
        num_xticks: null
        num_yticks: null
        show_legend: true
        legend_pos: best
        grid_on: false
        line_width: 1.0
        marker_style: o
        marker_size: 3
        filter_termination_reason: null

    - type: line
      enabled: false
      source: summary
      x_variable: episode_id
      y_variable: final_t_sec
      output_filename: fig3_episode_duration_per_episode.png
      config:
